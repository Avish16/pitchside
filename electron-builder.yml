appId: com.callcopilot.app
productName: Call Copilot
directories:
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!uploads/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.*.json}'
  - '!README.md'
asarUnpack:
  - resources/**
win:
  executableName: call-copilot
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.business
  target:
    - dmg
    - zip
  extendInfo:
    NSMicrophoneUsageDescription: Call Copilot uses the microphone to transcribe your side of a sales or customer call.
    NSAudioCaptureUsageDescription: Call Copilot uses system audio to transcribe the other people on the call.
    NSScreenCaptureUsageDescription: Call Copilot requests display capture only to reach system audio. The video track is discarded locally and is not recorded or uploaded.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  category: Office
  executableName: call-copilot
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
